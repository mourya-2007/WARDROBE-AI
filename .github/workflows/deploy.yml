name: Deploy Wardrobe AI to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and validate app source
        run: |
          cat .github/source-archive/part-*.b64 | base64 --decode > /tmp/wardrobe-ai-source.tar.xz
          xz -t /tmp/wardrobe-ai-source.tar.xz
          mkdir -p app
          tar -xJf /tmp/wardrobe-ai-source.tar.xz -C app

      - name: Install dependencies
        working-directory: app/wardrobe-ai-optimized
        run: npm install --no-audit --no-fund

      - name: Build for the GitHub Pages project URL
        working-directory: app/wardrobe-ai-optimized
        run: npm run build -- --base=/WARDROBE-AI/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/wardrobe-ai-optimized/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
